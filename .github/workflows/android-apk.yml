name: Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Prepare APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/*.apk release/heroes-planeta-movil.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: heroes-planeta-movil-apk
          path: release/heroes-planeta-movil.apk

      - name: Publish APK release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-apk
          name: Heroes del Planeta Movil APK
          body: APK instalable generado automaticamente desde la rama main.
          artifacts: release/heroes-planeta-movil.apk
          allowUpdates: true
          replacesArtifacts: true
